server:
  port: ${PORT:8080}

spring:
  application:
    name: kizuna-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kizuna_db}
    username: ${DATABASE_USER:kizuna_user}
    password: ${DATABASE_PASS:kizuna_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  sql:
    init:
      mode: never

  # Ensure WebSockets and STOMP endpoints route properly in hosted environments
  web:
    resources:
      chain:
        cache: false

backblaze:
  b2:
    key-id: ${B2_KEY_ID:placeholder_key_id}
    application-key: ${B2_APPLICATION_KEY:placeholder_application_key}
    bucket-name: ${B2_BUCKET_NAME:kizuna-bucket}
    endpoint: ${B2_ENDPOINT:https://s3.us-east-005.backblazeb2.com}
    region: ${B2_REGION:us-east-1}
