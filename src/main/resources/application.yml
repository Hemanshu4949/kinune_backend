server:
  port: ${PORT:8080}

spring:
  application:
    name: kizuna-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kizuna_db}
    username: ${DATABASE_USER:kizuna_user}
    password: ${DATABASE_PASS:kizuna_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # Ensure WebSockets and STOMP endpoints route properly in hosted environments
  web:
    resources:
      chain:
        cache: false
